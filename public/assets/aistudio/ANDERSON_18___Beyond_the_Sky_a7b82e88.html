<body>

<script>
(()=>{
'use strict';
/* ====== TEXTO DA CARTA (edite aqui, separado da lógica) ====== */
const CARTA=[
 'Anderson,',
 'Existem pessoas que aparecem na nossa vida por acaso… e existem aquelas que acabam se tornando parte dela.',
 'Nossa amizade nunca precisou ser perfeita. Às vezes, a gente só estava ali. E, para mim, isso já significava muito.',
 'Obrigado por ser meu companheiro, por me ouvir quando estou com problemas e por continuar próximo durante todos esses anos.',
 'Resende, tu é uma das pessoas mais próximas que eu tenho de uma família. E eu não escrevo isso apenas para deixar a homenagem bonita. Eu escrevo porque é o que sinto.',
 'Espero que esse novo ciclo traga coisas boas, oportunidades, momentos felizes e motivos para continuar seguindo em frente. Tu merece um dia especial.',
 'Eu te amo. Como amigo.',

];
const $=s=>document.querySelector(s),cv=$('#c'),x=cv.getContext('2d'),ui=$('#ui'),hint=$('#hint');
const TAU=Math.PI*2,R=Math.random,cl=(v,a=0,b=1)=>v<a?a:v>b?b:v,mix=(a,b,t)=>a+(b-a)*t;
const e2=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2,eo=p=>1-Math.pow(1-p,3),ei=p=>p*p*p;

let W=0,H=0,mob=false;
function size(){W=innerWidth;H=innerHeight;mob=W<640;const d=Math.min(devicePixelRatio||1,mob?1.5:2);cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}
size();addEventListener('resize',size);
/* ====== ESTADO DO CÉU ====== */
const S={top:[255,255,255],bot:[255,255,255],sun:0,sunX:.5,sunY:.4,gold:0,cloudA:0,part:0,spd:1,zoom:1.35,camY:0,dust:0,dusk:0,fest:0,bal:0,rib:0,n18:0,dis:0,fw:0,heart:0,road:0,roadZ:0,dim:0,shoot:-1,confet:0,flare:0,spark:0,bloom:.12};
function tw(o,k,to,ms,ef=e2){const f=Array.isArray(o[k])?o[k].slice():o[k],t0=performance.now(),D=ms*(RM?.5:1);return new Promise(r=>{(function st(n){const p=cl((n-t0)/D),v=ef(p);if(Array.isArray(f))for(let i=0;i<f.length;i++)o[k][i]=mix(f[i],to[i],v);else o[k]=mix(f,to,v);p<1?requestAnimationFrame(st):r()})(t0)})}
const sleep=ms=>new Promise(r=>setTimeout(r,RM?ms*.6:ms));
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
/* ====== SPRITES ====== */
const mk=(w,h,fn)=>{const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c};
const SP={},GS={};
function glowSpr(c){if(GS[c])return GS[c];return GS[c]=mk(64,64,g=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.18,`rgba(${c},.9)`);gr.addColorStop(.5,`rgba(${c},.22)`);gr.addColorStop(1,`rgba(${c},0)`);g.fillStyle=gr;g.fillRect(0,0,64,64)})}
const glow=(px,py,s,c,a)=>{if(a<=.01)return;x.globalAlpha=a>1?1:a;x.drawImage(glowSpr(c),px-s,py-s,s*2,s*2)};
function cloudSpr(){return mk(420,200,g=>{const cs=[];for(let k=0;k<17;k++)cs.push([70+R()*280,72+R()*60,30+R()*46]);cs.sort((p,q)=>p[1]-q[1]);
  for(const [px,py,r] of cs){const gr=g.createRadialGradient(px-r*.25,py-r*.45,r*.05,px,py,r);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.55,'rgba(250,252,255,.93)');gr.addColorStop(.85,'rgba(205,224,246,.78)');gr.addColorStop(1,'rgba(190,212,240,0)');g.fillStyle=gr;g.beginPath();g.arc(px,py,r,0,TAU);g.fill()}
  g.globalCompositeOperation='source-atop';let b=g.createLinearGradient(0,95,0,175);b.addColorStop(0,'rgba(160,190,230,0)');b.addColorStop(1,'rgba(150,182,226,.55)');g.fillStyle=b;g.fillRect(0,0,420,200);
  b=g.createLinearGradient(0,40,0,105);b.addColorStop(0,'rgba(255,246,226,.5)');b.addColorStop(1,'rgba(255,246,226,0)');g.fillStyle=b;g.fillRect(0,0,420,200)})}
function sprites(){SP.cloud=[0,1,2,3,4].map(cloudSpr)}
/* ====== ELEMENTOS ====== */
const CL=[],DU=[],ST=[],BL=[],CF=[],SK=[],RK=[],GP=[],SPK=[];let BC=null,BX=null;
const G={s:0,open:0,state:0,bob:0},K={s:0,rot:0,lit:[],out:0,smoke:[],wait:false};
function init(){sprites();
  for(let i=0;i<(mob?26:36);i++){const l=i%3;CL.push({x:R(),y:l==0?.12+R()*.4:l==1?.3+R()*.4:.55+R()*.4,l,s:.55+R()*.7,v:.004+R()*.006,v2:(R()-.5)*.02,sp:SP.cloud[i%5]})}
  for(let i=0;i<(mob?45:80);i++)DU.push({x:R(),y:R(),v:3+R()*8,ph:R()*TAU,s:2+R()*4});
  for(let i=0;i<130;i++)ST.push({x:R(),y:R()*.75,ph:R()*TAU,s:1+R()*2});
  const bc=['255,255,255','191,227,255','142,201,242','205,214,224','255,255,255','176,214,246'];
  for(let i=0;i<14;i++)BL.push({x:R(),y:1.1+R()*.6,v:.02+R()*.03,s:20+R()*14,ph:R()*TAU,c:bc[i%6]});
  for(let i=0;i<18;i++)K.lit.push(0);for(let i=0;i<46;i++)SPK.push({x:R(),y:R()*.9,ph:R()*TAU,s:8+R()*14});BC=document.createElement('canvas');BX=BC.getContext('2d')}
/* ====== DESENHO ====== */
function drawClouds(l,t){for(const c of CL){if(c.l!==l)continue;c.x+=(c.v*S.spd*(1+l*.6))*.016+c.v2*.016*(S.fest>.2?1:0);if(c.x>1.3)c.x=-.3;if(c.x<-.3)c.x=1.3;
  const x0=c.x*1.5-.25,dir=x0<.5?-1:1,off=dir*S.part*W*.5*(.8+.3*l)+(x0-.5)*S.part*W*.6,px=x0*W+off,py=c.y*H-S.camY*(.25+l*.35),k=c.s*(.7+.45*l)*(W<640?.8:1)*W/800*1.2;
  x.globalAlpha=S.cloudA*(.55+.22*l);x.drawImage(c.sp,px-210*k,py-100*k,420*k,200*k)}x.globalAlpha=1}
function drawSun(t){if(S.sun<.02)return;const sx=W*S.sunX,sy=H*S.sunY;x.save();x.globalCompositeOperation='lighter';glow(sx,sy,H*.55*S.sun,'255,255,255',.9*S.sun);if(S.gold>.02)glow(sx,sy,H*.35*S.sun,'255,226,160',.8*S.gold);
  for(let i=0;i<7;i++){const a=Math.PI*.2+i*.32+Math.sin(t*.2+i)*.05;x.save();x.translate(sx,sy);x.rotate(a);const g=x.createLinearGradient(0,0,H*1.3,0);g.addColorStop(0,`rgba(255,248,225,${.14*S.sun})`);g.addColorStop(1,'rgba(255,248,225,0)');x.fillStyle=g;x.beginPath();x.moveTo(0,0);x.lineTo(H*1.3,-H*.05);x.lineTo(H*1.3,H*.05);x.closePath();x.fill();x.restore()}x.restore()}
let P18=null,P18k='';
function pts18(sz){const key=sz|0;if(P18&&P18k===key)return P18;P18k=key;const c=mk(420,220,g=>{g.font='800 190px Nunito,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('18',210,115)}),d=c.getContext('2d').getImageData(0,0,420,220).data;P18=[];
  for(let j=0;j<220;j+=4)for(let i=0;i<420;i+=4)if(d[(j*420+i)*4+3]>128)P18.push({x:(i-210)/420,y:(j-115)/220,vx:(R()-.5)*2,vy:-R()*1.4-.2,ph:R()*TAU});return P18}
function draw18(t){if(S.n18<.01)return;const sz=Math.min(W,H)*.5*S.n18,cx=W/2,cy=H*.32;x.save();x.translate(cx,cy);
  x.save();x.globalCompositeOperation='lighter';glow(0,0,sz*1.05,'190,222,255',.45*S.n18);x.restore();
  if(S.dis<.02){x.rotate(Math.sin(t*.5)*.03);x.scale(.94+.06*Math.cos(t*.7),1);x.font=`800 ${sz}px Nunito,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.save();x.fillStyle='rgba(30,70,140,.22)';x.translate(sz*.1,sz*.24);x.scale(1,.32);x.fillText('18',0,0);x.restore();
    for(let i=18;i>=1;i--){const k=i/18;x.fillStyle=`rgb(${Math.round(92+k*44)},${Math.round(112+k*40)},${Math.round(150+k*30)})`;x.fillText('18',i*sz*.011,i*sz*.011)}
    const g=x.createLinearGradient(0,-sz*.5,0,sz*.5);g.addColorStop(0,'#ffffff');g.addColorStop(.28,'#e4ecf7');g.addColorStop(.48,'#9fb4cf');g.addColorStop(.52,'#f6faff');g.addColorStop(.8,'#c3d2e6');g.addColorStop(1,'#ffffff');x.fillStyle=g;x.fillText('18',0,0);
    x.lineWidth=Math.max(2,sz*.012);x.strokeStyle='rgba(255,255,255,.95)';x.strokeText('18',0,0);
    x.globalCompositeOperation='lighter';const sw=((t*.4)%1.8-.4)*sz*1.7-sz*.85;glow(sw,-sz*.05,sz*.32,'255,255,255',.6);
    for(let i=0;i<7;i++){const a=t*.6+i*TAU/7;glow(Math.cos(a)*sz*.78,Math.sin(a)*sz*.46,4+Math.sin(t*3+i)*2,'255,255,255',.9)}x.globalCompositeOperation='source-over'}
  else{const P=pts18(sz);x.globalCompositeOperation='lighter';const d=S.dis;for(const p of P){const px=p.x*sz*2.3+p.vx*d*sz*.8+Math.sin(t+p.ph)*d*14,py=p.y*sz*1.1+p.vy*d*sz*.8;glow(px,py,3+4*(1-d),'220,236,255',(1-d)*.9)}}
  x.restore()}
function drawPlatform(t){if(S.fest<.01)return;const f=eo(S.fest),by=H*.8+(1-f)*H*.5,pw=W*(mob?.9:.62);x.save();x.globalAlpha=f;
  for(let i=0;i<7;i++){const cx=W/2+(i-3)*pw*.16;x.drawImage(SP.cloud[i%3],cx-120,by-30+Math.abs(i-3)*8,240,115)}
  x.shadowColor='rgba(40,90,160,.3)';x.shadowBlur=20;x.shadowOffsetY=8;let g=x.createLinearGradient(0,by-14,0,by+14);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#cfdceb');x.fillStyle=g;x.beginPath();x.ellipse(W/2,by,pw*.5,H*.04,0,0,TAU);x.fill();x.shadowColor='transparent';
  g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#dfe6ef');g.addColorStop(.5,'#ffffff');g.addColorStop(1,'#dfe6ef');x.strokeStyle=g;x.lineWidth=4;x.beginPath();x.ellipse(W/2,by,pw*.5,H*.04,0,0,TAU);x.stroke();
  for(let sd=-1;sd<=1;sd+=2){for(let i=0;i<9;i++){const a=i/8*Math.PI,px=W/2+sd*pw*.5*.92+Math.cos(a)*sd*(-pw*.16)+0,py=by-H*.04-Math.sin(a)*H*.2,r=11+Math.sin(i)*3;x.fillStyle=['#fff','#bfe3ff','#8ec9f2','#cdd6e0'][i%4];x.beginPath();x.arc(px-sd*pw*.04,py,r,0,TAU);x.fill();x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.arc(px-sd*pw*.04-r*.3,py-r*.3,r*.22,0,TAU);x.fill()}}
  x.strokeStyle='rgba(120,150,190,.7)';x.lineWidth=1.5;x.beginPath();for(let i=0;i<=20;i++){const u=i/20,gx=W/2-pw*.4+u*pw*.8,gy=by-H*.2+Math.sin(u*Math.PI)*H*.07+Math.sin(t*1.5+u*6)*2;i?x.lineTo(gx,gy):x.moveTo(gx,gy)}x.stroke();
  const gc=['#2f7fd1','#ffffff','#c5ced9','#8ec9f2'];for(let i=0;i<14;i++){const u=(i+.5)/14,gx=W/2-pw*.4+u*pw*.8,gy=by-H*.2+Math.sin(u*Math.PI)*H*.07;x.fillStyle=gc[i%4];x.beginPath();x.moveTo(gx-10,gy);x.lineTo(gx+10,gy);x.lineTo(gx,gy+22+Math.sin(t*2+i)*2);x.closePath();x.fill()}
  for(let i=0;i<12;i++){const px=W/2-pw*.44+i*pw*.08,py=by+H*.012;x.fillStyle='#fff';for(let k=0;k<5;k++){const a=k/5*TAU+i;x.beginPath();x.ellipse(px+Math.cos(a)*6,py+Math.sin(a)*6,5,3,a,0,TAU);x.fill()}x.fillStyle='#ffe29a';x.beginPath();x.arc(px,py,3,0,TAU);x.fill()}

function drawBalloons(t,dt){const n=Math.round(S.bal*(mob?9:14));for(let i=0;i<n;i++){const b=BL[i];b.y-=b.v*dt*S.spd;b.x+=Math.sin(t*.8+b.ph)*.0008;if(b.y<-.25){b.y=1.2;b.x=R()}const bx=b.x*W,by=b.y*H,s=b.s*(W<640?.85:1);
  x.globalAlpha=.95;x.strokeStyle='rgba(120,140,170,.6)';x.lineWidth=1;x.beginPath();x.moveTo(bx,by+s*1.15);x.quadraticCurveTo(bx+Math.sin(t*2+b.ph)*6,by+s*2.4,bx,by+s*3.6);x.stroke();
  const g=x.createRadialGradient(bx-s*.3,by-s*.35,s*.1,bx,by,s*1.25);g.addColorStop(0,'#fff');g.addColorStop(.35,`rgb(${b.c})`);g.addColorStop(1,'rgb(120,160,205)');x.fillStyle=g;x.beginPath();x.ellipse(bx,by,s*.85,s*1.1,0,0,TAU);x.fill();x.fillStyle='rgba(255,255,255,.65)';x.beginPath();x.ellipse(bx-s*.32,by-s*.4,s*.14,s*.3,-.5,0,TAU);x.fill()}x.globalAlpha=1}
function drawRibbons(t){if(S.rib<.02)return;x.lineCap='round';for(let k=0;k<4;k++){const sd=k%2?1:-1,y0=H*(.18+k*.14),n=34;x.beginPath();let px=0,py=0;for(let i=0;i<=n;i++){const u=i/n*S.rib,xx=sd<0?-10+u*W*.5:W+10-u*W*.5,yy=y0+Math.sin(u*7+t*.9+k)*H*.05*u+u*H*.1;const f=Math.abs(Math.cos(u*11+t*1.2+k));if(i){x.strokeStyle=`rgba(${190+f*55|0},${205+f*45|0},${225+f*30|0},.9)`;x.lineWidth=3+5*f;x.beginPath();x.moveTo(px,py);x.lineTo(xx,yy);x.stroke()}px=xx;py=yy}}}
function drawGift(t){if(G.s<.02)return;const gx=W/2,gy=H*.5,u=Math.min(W,H)*.17*eo(G.s),bob=Math.sin(t*1.6)*6*(1-G.open),w=u*1.2,h=u*.9,x0=gx-w/2,y0=gy-u*.1+bob,lid=-G.open*u*1.3;
  x.save();x.shadowColor='rgba(40,90,160,.3)';x.shadowBlur=24;x.shadowOffsetY=14;let g=x.createLinearGradient(x0,y0,x0+w,y0+h);g.addColorStop(0,'#fbfdff');g.addColorStop(1,'#d5e2f2');x.fillStyle=g;x.fillRect(x0,y0,w,h);x.shadowColor='transparent';
