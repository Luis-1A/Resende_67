const LT5=`Prezado Anderson,

Venho, por meio desta, apresentar minhas mais sinceras condolências pelo seu falecimento futuro.

Foi uma honra conhecer você enquanto ainda se encontrava entre os vivos.

Neste momento tão delicado, gostaria de reconhecer seus serviços prestados à humanidade durante seus primeiros 18 anos de existência.

Sua presença será lembrada, suas conversas serão arquivadas e suas decisões questionáveis continuarão sendo investigadas por tempo indeterminado.

Espero que tenha aproveitado seu aniversário, porque o tempo continua passando e, infelizmente, ainda não inventaram uma maneira de cancelar o envelhecimento.

Ressalto que esta nota não representa uma previsão. Trata-se apenas de uma demonstração de amizade e de um senso de humor que claramente precisava ser supervisionado.

Receba meus sentimentos antecipados e meus votos de muitos anos de vida.

Atenciosamente,

Seu amigo, que não encontrou uma maneira normal de desejar feliz aniversário.`;
const LT7=`Anderson,

Hoje é seu aniversário, e eu queria te entregar alguma coisa diferente.

A gente se conheceu no Free Fire, de um jeito que talvez nenhum dos dois imaginasse que acabaria levando a uma amizade. É curioso pensar que uma coisa tão simples pode colocar alguém no caminho da gente.

Eu não sei como serão os próximos anos. Não sei quantas coisas vão mudar, quantas histórias ainda vamos viver ou onde cada um de nós vai estar no futuro.

Mas espero que a vida te dê muitos motivos para sorrir.

Espero que você encontre pessoas que te façam bem, que consiga realizar aquilo que realmente deseja e que tenha coragem para continuar tentando quando alguma coisa não sair como esperava.

Fazer 18 anos não significa que você precisa saber tudo sobre a vida. Ninguém recebe um manual de instruções quando chega nessa fase.

Você ainda tem muita coisa pela frente. Espero que possa aproveitar as oportunidades que aparecerem, aprender com o que der errado e guardar com carinho as coisas boas que acontecerem pelo caminho.

Também espero que a nossa amizade continue existindo no meio de todas essas mudanças.

Talvez, daqui a muitos anos, a gente olhe para trás e ache engraçado pensar que tudo começou em um jogo. Talvez existam histórias que hoje nem conseguimos imaginar.

Seja como for, fico feliz por ter conhecido você.

E, mesmo que eu tenha escolhido uma maneira completamente desnecessária de falar sobre a mortalidade humana nesta homenagem, quero que você entenda uma coisa: desejo que você viva muito, que seja feliz e que tenha muitas oportunidades de construir uma vida da qual se orgulhe.

Obrigado pela amizade, Anderson.

Feliz aniversário. Espero que este dia seja apenas o começo de muitas coisas boas.

E não se acostume com essa quantidade de sentimentalismo. Foi uma ocasião especial. Não pretendo transformar isso em hábito.

Com carinho,

Seu amigo.`;
const LT9=`Se você chegou até aqui, então viu tudo o que preparei.

Talvez eu não seja a pessoa mais habilidosa para demonstrar essas coisas de maneira normal. Por isso, aparentemente, precisei criar um site inteiro, colocar flores, desenhar corações e escrever uma carta de condolências para conseguir desejar feliz aniversário.

Mas, brincadeiras à parte, obrigado por fazer parte da minha vida.

Espero que você seja feliz, que tenha muitas oportunidades de realizar seus sonhos e que nunca faltem motivos para continuar acreditando nas coisas boas que ainda podem acontecer.

Feliz aniversário, Anderson.

Que venham muitas outras histórias.`;
