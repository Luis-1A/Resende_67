<!doctype html>
<html lang="pt-BR">
<head>

<title>Anderson, o Resende — 18 anos</title>
<meta name="description" content="Site comemorativo e interativo de 18 anos de Anderson (Resende).">
<meta property="og:title" content="Anderson, o Resende — 18 anos">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#174F88;--blue:#318DE0;--sky:#79C5FF;--cel:#B9E0FF;--mist:#EAF5FF;--ice:#F5FAFF;--silver:#DCE5EE;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:#F5FAFF;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:500 clamp(1rem,4vw,1.15rem)/1.65 "Nunito",system-ui,sans-serif;background:linear-gradient(180deg,#fff,var(--ice) 45%,var(--mist))}
.sky{position:fixed;inset:0;opacity:0;transition:opacity 4s ease;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.95),transparent 50%),radial-gradient(ellipse at 8% 18%,rgba(185,224,255,.55),transparent 45%),radial-gradient(ellipse at 94% 88%,rgba(185,224,255,.5),transparent 45%)}
.sky.on{opacity:1}
#cv{position:fixed;inset:0;width:100%;height:100%}
.dot{position:fixed;left:50%;top:42%;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--sky);box-shadow:0 0 22px 8px rgba(121,197,255,.5);opacity:0;transition:opacity 1.6s,transform 1.6s}
.dot.on{opacity:1}.dot.off{opacity:0;transform:scale(.3)}
.ring{position:fixed;left:50%;top:42%;width:240px;height:240px;margin:-120px;border-radius:50%;border:2px solid rgba(121,197,255,.6);opacity:0;pointer-events:none}
#txt{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:9vh 6vw 8vh}
#txt.low{justify-content:flex-start;padding-top:40vh}
#hv{position:fixed;top:calc(8vh + env(safe-area-inset-top,0px));left:50%;width:130px;margin-left:-65px}
.t{opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.4s cubic-bezier(.22,1,.36,1);margin:.5em 0;max-width:34em}
.t.in{opacity:1;transform:none}
.sub{font-size:clamp(1.1rem,4.6vw,1.5rem);font-weight:700}
.hw{font:600 clamp(1.9rem,8vw,3rem)/1.2 "Caveat",cursive;color:var(--blue)}
.dt{font:800 clamp(2.4rem,11vw,4.2rem)/1.1 "Nunito",sans-serif;color:var(--blue);letter-spacing:.04em}
.ttl{margin:0;font:800 clamp(2.2rem,12.5vw,6rem)/1.1 "Nunito",sans-serif;letter-spacing:.05em}
.w{display:inline-block;white-space:nowrap}
.L{display:inline-block;opacity:0;transform:translateY(.5em);transition:opacity 1s ease,transform 1.2s cubic-bezier(.16,1,.3,1);
  background:linear-gradient(105deg,#2c86da 0 40%,#f2faff 50%,#2c86da 60% 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ttl.in .L{opacity:1;transform:none}
.ttl.shine .L{animation:shine 1.4s ease-in-out forwards;animation-delay:calc(var(--i)*60ms)}
@keyframes shine{to{background-position:0 0}}
.ak{font-weight:700;margin:.8rem 0 0}
.reveal{display:inline-block;clip-path:inset(0 100% 0 0);transition:clip-path 1.8s cubic-bezier(.4,0,.2,1)}
.reveal.in{clip-path:inset(0 0 0 0)}
.ln{height:2px;width:0;margin:1rem auto 0;background:linear-gradient(90deg,transparent,var(--sky),transparent);transition:width 1.4s ease}
.ln.in{width:min(70vw,360px)}
.arr{margin-top:1.4rem;width:48px;height:48px;border:0;background:none;color:var(--blue);font-size:1.6rem;cursor:pointer;animation:ar 2.4s ease-in-out infinite}
.arr:focus-visible,.btn:focus-visible,#sk:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
@keyframes ar{50%{transform:translateY(7px)}}
.sheet{width:100%;max-width:34rem;max-height:70vh;overflow-y:auto;text-align:left;padding:1.4rem 1.3rem;background:#fff;border:1px solid var(--mist);border-radius:14px;box-shadow:0 20px 50px rgba(49,141,224,.16),0 2px 8px rgba(23,79,136,.06);transition:opacity 1.2s,transform 1.4s cubic-bezier(.22,1,.36,1)}
.sheet.sm{max-height:36vh}
.sheet.zoom{transform:scale(1.03)}
.sheet .t{max-width:none;margin:.7em 0}
.eb{font-size:.75rem;font-weight:800;letter-spacing:.12em;color:var(--blue)}
.em{font-weight:800;font-size:1.25rem}
.hl{text-decoration:none;box-shadow:inset 0 -.35em rgba(121,197,255,.5)}
.btn{margin-top:1.2rem;min-height:48px;padding:0 1.8rem;border:1px solid var(--blue);border-radius:999px;background:#fff;color:var(--blue);font:800 1rem "Nunito",sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:0 6px 18px rgba(49,141,224,.18);transition:transform .15s,box-shadow .2s}
.btn:hover{box-shadow:0 10px 24px rgba(49,141,224,.28)}.btn:active{transform:scale(.96)}
.envelope{position:relative;width:210px;height:136px;margin:1rem auto;background:#fff;border:1px solid var(--cel);border-radius:6px;box-shadow:0 14px 34px rgba(49,141,224,.2)}
.flap{position:absolute;top:0;left:0;width:100%;height:70px;background:var(--mist);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.3s}
.seal{position:absolute;left:50%;top:52px;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px var(--cel);transition:opacity .9s,transform .9s}
.glow{position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,rgba(121,197,255,.8),transparent 70%);opacity:0;transition:opacity 1.4s}
.open .flap{transform:rotateX(180deg)}.open .seal{opacity:0;transform:scale(2)}.open .glow{opacity:1}
.bub{position:fixed;bottom:-30px;border-radius:50%;border:1.5px solid rgba(121,197,255,.8);background:rgba(185,224,255,.25);animation:bu 3.2s ease-in forwards;pointer-events:none}
@keyframes bu{to{transform:translateY(-70vh);opacity:0}}
#dist{position:fixed;top:calc(9vh + env(safe-area-inset-top,0px));left:0;right:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 1.2s;pointer-events:none;--w:18px}
#dist.on{opacity:1}
#dist i{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px var(--sky)}
#dist b{display:block;height:2px;width:var(--w);background:var(--sky);transition:width 3.4s ease-in-out}
.hs{width:100%;height:auto;overflow:visible;display:block;animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.hs path.l{fill:none;stroke:var(--blue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 3.6s ease-in-out}
.hs.in path.l{stroke-dashoffset:0}
.hs.pulse{animation:pls 1s ease-in-out 1}
@keyframes pls{50%{transform:scale(1.1)}}
#hint{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.85rem;color:rgba(23,79,136,.75);opacity:0;transition:opacity .8s;pointer-events:none;z-index:4}
#hint.on{opacity:1}
#sk{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;min-height:44px;padding:0 16px;border:1px solid var(--cel);border-radius:999px;background:rgba(255,255,255,.8);color:var(--ink);font:700 .85rem "Nunito",sans-serif;cursor:pointer}
.circ{position:fixed;left:50%;top:30%;width:60px;height:60px;margin:-30px;border-radius:50%;background:radial-gradient(circle,#fff,var(--cel));transform:scale(0);transition:transform 1.3s cubic-bezier(.6,0,.3,1);z-index:6}
.circ.on{transform:scale(60)}
.dark{position:fixed;inset:0;background:radial-gradient(circle at 50% 45%,#0a1a3c,#03060f 70%);transition:opacity 2.4s}
.blue{position:fixed;inset:0;opacity:0;transition:opacity 1.2s ease;background:linear-gradient(135deg,#54ACFF,#287FD1 55%,#174B80);background-size:200% 200%;animation:bm 18s ease-in-out infinite}
.blue.on{opacity:1}
@keyframes bm{50%{background-position:100% 100%}}
#txt.onblue{color:#fff;text-shadow:0 2px 16px rgba(23,75,128,.55)}
#txt.onblue .dt{color:#C7E5FF;text-shadow:0 0 26px #54ACFF}
#sq{position:fixed;left:50%;top:44%;width:min(86vw,360px);height:min(62vw,260px);transform:translate(-50%,-50%);opacity:0;transition:opacity 1.2s,transform 1.8s cubic-bezier(.6,0,.3,1);pointer-events:none}
#sq.on{opacity:1}#sq.spin{transform:translate(-50%,-50%) rotate(16deg) scale(.4)}
#sq svg{position:absolute;inset:0;width:100%;height:100%}
#sq path{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.4s ease}
#sq path.in{stroke-dashoffset:0}
.nd{position:absolute;transform:translate(-50%,-50%);opacity:0;transition:opacity 1s;text-align:center}
.nd.in{opacity:1}
.nd i{display:block;width:16px;height:16px;margin:0 auto;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px rgba(255,255,255,.55)}
.nd b{display:block;margin-top:.4rem;font-size:.9rem;color:#fff;letter-spacing:.06em}
.pg{position:fixed;width:130px;padding:1rem .6rem;background:#fff;border:1px solid var(--cel);border-radius:6px;box-shadow:0 10px 26px rgba(49,141,224,.2);text-align:center;font-weight:800;color:var(--blue);z-index:3;pointer-events:none}
.bb{position:fixed;padding:.5rem .95rem;border-radius:18px;background:#fff;border:1px solid var(--cel);color:var(--ink);font-weight:700;font-size:.9rem;z-index:3;box-shadow:0 8px 20px rgba(49,141,224,.18);pointer-events:none}
.hr{position:fixed;left:50%;top:48%;width:min(92vw,560px);transform:translate(-50%,-50%);z-index:3;pointer-events:none}
.hr path,.pt path{fill:none;stroke:var(--sky);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--sky))}
.pt{position:fixed;left:0;right:0;bottom:0;height:60%;width:100%;z-index:3;pointer-events:none}
.pt path{stroke-width:.8}
.gl{position:fixed;width:120px;height:120px;margin:-60px;border-radius:50%;background:radial-gradient(circle,#fff,rgba(121,197,255,.7) 40%,transparent 70%);z-index:3;pointer-events:none;opacity:0}
.lq{position:fixed;width:12px;height:12px;border-radius:2px;z-index:3;pointer-events:none;box-shadow:inset 0 -2px rgba(0,0,0,.2)}
#txt.bottom{justify-content:flex-end;padding:6vh 6vw calc(7vh + env(safe-area-inset-bottom,0px))}
.lgt{font-weight:800;font-size:clamp(1.5rem,6.5vw,2.4rem);text-shadow:0 0 18px rgba(255,255,255,.9)}
.lgs{font-size:clamp(.95rem,3.6vw,1.2rem);font-weight:700;text-shadow:0 0 14px rgba(255,255,255,.9)}
.rdot{position:fixed;left:50%;top:calc(8vh + 60px);width:14px;height:14px;margin:-7px;border-radius:50%;background:#E4465B;box-shadow:0 0 22px 8px rgba(228,70,91,.45);z-index:3;pointer-events:none}
.hs path.r2{stroke:#E4465B;fill:rgba(228,70,91,0);transform-origin:50px 46px;transform:scale(.58);transition:stroke-dashoffset 3.6s ease-in-out .6s,fill 2s ease 3s}
.hs.in.fr path.r2{fill:rgba(228,70,91,.22)}
.tl{position:fixed;left:0;right:0;top:46%;width:100%;z-index:3;pointer-events:none}
.tl path{fill:none;stroke:var(--sky);stroke-width:.5;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 2px var(--sky))}
.tl text{font:800 4px "Nunito",sans-serif;fill:var(--blue);opacity:0;text-anchor:middle}
.n18 text{font:800 40px "Nunito",sans-serif;fill:none;stroke:var(--blue);stroke-width:.8;stroke-dasharray:140;stroke-dashoffset:140;text-anchor:middle;filter:drop-shadow(0 0 3px var(--sky))}
.fw{opacity:0;transform:scale(.96);transition:opacity 1.6s ease,transform 2.2s ease;color:#F8FCFF;text-shadow:0 0 22px rgba(160,200,255,.7);font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.05;margin:0}
.fw.on{opacity:1;transform:none}
.f1{font-size:clamp(3.4rem,19vw,9rem)}
.f2{font-size:clamp(2.2rem,11.5vw,6rem)}
.imp{font-size:clamp(1.8rem,8vw,3.2rem);line-height:1.15;font-weight:800;color:var(--ink)}
.mini{background:none;border:0;color:var(--blue);font:700 .8rem "Nunito",sans-serif;text-decoration:underline;cursor:pointer;min-height:36px;padding:0 6px}
.sheet .mini{float:right;margin:-6px -6px 0 0}
.sk2{position:fixed;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.orbs{position:fixed;inset:0;z-index:4;pointer-events:none}
.orb{position:absolute;width:68px;height:84px;margin:-42px;border:0;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;pointer-events:auto;cursor:pointer;background:radial-gradient(circle at 32% 28%,#fff,#B9E0FF 40%,#54ACFF 75%,#287FD1);box-shadow:0 10px 26px rgba(49,141,224,.35);animation:ob 3.2s ease-in-out infinite;transition:transform .5s,opacity .5s}
.orb:focus-visible,.pc:focus-visible,.pen:focus-visible,.tlx button:focus-visible{outline:2px solid var(--blue);outline-offset:4px}
.orb.pop{transform:scale(2.2);opacity:0;pointer-events:none;animation:none}
@keyframes ob{50%{transform:translateY(-12px)}}
.orbcap{min-height:5.5em;font-weight:700;font-size:clamp(1.1rem,4.6vw,1.5rem);max-width:28em}
.tlx{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:30rem;margin-bottom:1rem}
.tlx button{min-width:68px;min-height:44px;border:1px solid var(--cel);border-radius:999px;background:#fff;color:var(--blue);font:800 .95rem "Nunito",sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(49,141,224,.15)}
.tlx button.on{background:var(--blue);color:#fff}
button.envelope{padding:0;display:block;cursor:pointer;margin:1rem auto}
.pcs{display:flex;gap:1.6rem;justify-content:center;margin-top:1.6rem}
.pc{position:relative;width:84px;height:52px;border:1px solid rgba(23,79,136,.25);border-radius:6px;cursor:pointer;box-shadow:0 8px 18px rgba(23,79,136,.2);animation:ob 2.8s ease-in-out infinite;transition:transform .5s,opacity .5s;color:inherit}
.pc::before{content:"";position:absolute;top:-9px;left:12px;width:14px;height:10px;border-radius:4px 4px 0 0;background:inherit;border:1px solid rgba(23,79,136,.25);border-bottom:0;box-shadow:24px 0 0 0 currentColor,48px 0 0 0 currentColor}
.pc.on{transform:translateY(10px) scale(.92);opacity:.6;animation:none}
.pen{background:none;border:0;width:min(60vw,220px);cursor:pointer}
.pen svg{width:100%;height:auto;overflow:visible}
.pen path{fill:none;stroke:#8a99ad;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1}
#bunt{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:46px;z-index:2;pointer-events:none;transition:opacity 1s}
#bunt::before{content:"";position:absolute;left:0;right:0;top:4px;height:2px;background:rgba(23,79,136,.35)}
#bunt i{position:absolute;top:5px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid;transform-origin:50% 0;animation:sw 3s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(23,79,136,.25))}
@keyframes sw{50%{transform:rotate(7deg)}}
.orb::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:46px;background:rgba(23,79,136,.4)}
.orb:nth-child(3n+2){background:radial-gradient(circle at 32% 28%,#fff,#ffb3bd 40%,#E4465B 75%,#b3283c)}
.orb:nth-child(3n){background:radial-gradient(circle at 32% 28%,#fff,#eef3f9 40%,#c3d1e0 75%,#9eacbc)}
.phr{position:fixed;transform:translate(-50%,-50%);color:#fff;font:700 clamp(1.1rem,4.5vw,1.8rem)/1.25 "Nunito",sans-serif;text-shadow:0 0 18px rgba(160,200,255,.9);z-index:4;pointer-events:none;text-align:center;max-width:80vw;opacity:0}
.phr.big{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.6rem,13vw,6rem)}
#tg{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:7;color:rgba(23,79,136,.7);font-size:.72rem}
#txt .skyt{text-shadow:0 0 18px rgba(255,255,255,.95),0 0 4px rgba(255,255,255,.9)}
#sq path{stroke:#287FD1}.nd i{background:#287FD1;box-shadow:0 0 18px 6px rgba(40,127,209,.45)}.nd b{color:#174F88}
#wash{position:fixed;inset:0;background:#F5FAFF;opacity:1;pointer-events:none;transition:opacity 2.4s ease}
@media (prefers-reduced-motion:reduce){.L{transform:none;transition-delay:0s!important}.arr,.hs{animation:none}.bub{display:none}.reveal{clip-path:none}}
</style>
</head>
<body>

<div class="dark" id="dark"></div>
<div class="blue" id="blue"></div>
<canvas id="cv" aria-hidden="true"></canvas>
<div class="dot" id="dot"></div>
<div id="dist" aria-hidden="true"><i></i><b></b><i></i></div>
<div id="hv" aria-hidden="true"></div>
<div id="sq" aria-hidden="true"></div>
<main id="txt" aria-live="polite"></main>
<div id="hint">toque para continuar</div>
<button id="sk" type="button">Pular introdução</button>
<button id="tg" class="mini" type="button" aria-pressed="false">toque pula animação: não</button>
<script>
(()=>{
